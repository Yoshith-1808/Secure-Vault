# Application
spring.application.name=password-manager
server.port=8089

# Database (Oracle) - Environment Variable Configured
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:default_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA (Oracle)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session
server.servlet.session.timeout=30m

# Encryption Key - Configured via Environment
app.encryption.secret=${APP_ENCRYPTION_SECRET:SecureVaultDefaultKeyChangeInProd!}

# Logging
logging.level.com.passmanager=INFO
logging.level.org.springframework.security=WARN
spring.jpa.open-in-view=false

# Error details
server.error.include-stacktrace=never
server.error.include-message=never

# Email configuration for OTP (Configured via Environment)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
